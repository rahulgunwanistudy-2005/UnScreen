<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">How UnScreen turns a shared picture into accessible content</title><desc id="desc">Capture and change detection send frames to a guarded vision pipeline. Independent reads are checked, stable identifiers produce patches, and the reader announces verified changes. Pictures stay in engine memory.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f1e3d"/></marker></defs>
<rect width="1400" height="850" fill="#f3f5f7"/>
<g fill="#0f1e3d" font-family="Arial, sans-serif"><text x="60" y="75" font-size="38" font-weight="700">UnScreen</text><text x="60" y="115" font-size="25">From a shared picture to a navigable document</text></g>
<g fill="#fff" stroke="#0f1e3d" stroke-width="2"><rect x="60" y="180" width="360" height="150" rx="8"/><rect x="520" y="180" width="360" height="150" rx="8"/><rect x="980" y="180" width="360" height="150" rx="8"/><rect x="980" y="470" width="360" height="150" rx="8"/><rect x="520" y="470" width="360" height="150" rx="8"/><rect x="60" y="470" width="360" height="150" rx="8"/></g>
<g fill="#0f1e3d" font-family="Arial, sans-serif" font-size="20"><text x="85" y="220" font-weight="700">Choose a shared tab</text><text x="85" y="260">Browser capture</text><text x="85" y="295">Change gate and pointer tracker</text><text x="545" y="220" font-weight="700">Daily allowance</text><text x="545" y="260">Reserve calls and estimated USD</text><text x="545" y="295">Keep API keys on the engine</text><text x="1005" y="220" font-weight="700">Independent vision reads</text><text x="1005" y="260">Full read or changed region</text><text x="1005" y="295">Cross-check before confidence</text><text x="1005" y="510" font-weight="700">Keep uncertainty visible</text><text x="1005" y="550">Disagreements become unclear</text><text x="1005" y="585">Failed checks retain last version</text><text x="545" y="510" font-weight="700">Align stable identifiers</text><text x="545" y="550">Diff into small JSON patches</text><text x="545" y="585">Preserve existing reader elements</text><text x="85" y="510" font-weight="700">Read and follow changes</text><text x="85" y="550">Tables, code, headings and lists</text><text x="85" y="585">Polite announcements, Ask, history</text></g>
<g stroke="#0f1e3d" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M420 255 H505"/><path d="M880 255 H965"/><path d="M1160 330 V455"/><path d="M980 545 H895"/><path d="M520 545 H435"/></g>
<rect x="60" y="700" width="1280" height="90" fill="#ffe446" rx="8"/><g fill="#0f1e3d" font-family="Arial, sans-serif" font-size="22"><text x="85" y="738">Live frames stay in memory. Gemini requests set store=false. The daily ledger stores counts and estimates only.</text><text x="85" y="770">Local architecture illustration. Human screen-reader and real Google Meet validation remain pending.</text></g></svg>